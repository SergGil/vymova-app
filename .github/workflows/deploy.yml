name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Dependabot (.github/dependabot.yml) catches known-vulnerable deps
        # on a weekly cycle via PRs; this catches one the moment it lands
        # (a new dependency, or an existing one whose advisory just got
        # published) instead of waiting for the next scheduled run.
        # --omit=dev: scoped to production deps only, i.e. what actually
        # ships in dist/ and reaches end users. Dev-only CLI tooling
        # (firebase-tools, wrangler, shadcn) drags in known-vulnerable
        # transitive deps (tar, sharp, @hono/node-server) that never leave
        # a contributor's machine — gating the deploy on those would just
        # be noise, not a real user-facing risk.
        # --audit-level=high: low/moderate advisories are common enough
        # that gating on them would add friction without much real
        # protection; high/critical still block the deploy.
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        # Standard npm test (`vitest run`, no flags) works fine locally and
        # in most CI runs, but the full suite has intermittently OOM'd here
        # on GitHub's runner (see vite.config.js's onUnhandledError/retry
        # comment — a known, unresolved vitest/vite-node full-suite
        # flakiness, not this repo's code). --maxWorkers caps concurrent
        # worker processes (default is one per CPU core, ~4 here) so peak
        # memory stays well under the runner's ceiling, at some cost to
        # wall-clock time; NODE_OPTIONS gives each of those processes more
        # headroom before hitting V8's default heap limit. CI-only (this
        # overrides `npm test`, not the local `npm test` script devs use
        # day to day). Verified locally against vitest's actual CLI flags
        # (`vitest run --help`) before pushing, after --poolOptions.* (a
        # guess, not a real flag) failed the previous attempt at this fix.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run --maxWorkers=2

      - name: Build
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
          # Both optional. VITE_FIREBASE_CONFIG feeds both App Check
          # (js/core/app-check.ts, needs the site key below too) and
          # Analytics (js/core/analytics.ts, activates on its own once the
          # config's measurementId is present — see public/privacy.html's
          # "Usage analytics" section, which must stay accurate to this).
          # Unset = both stay inert, same as today. Repo → Settings → Secrets
          # and variables → Actions → Variables → New repository variable.
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
