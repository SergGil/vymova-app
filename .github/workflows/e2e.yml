name: E2E Tests

# Playwright e2e suite (tests-e2e/) — separate from deploy.yml's unit-test
# gate since this is much heavier (real Chromium instances, a Firebase RTDB
# emulator, several real duel matches played end to end). Every duel spec
# that actually writes to Firebase (room creation, tournaments, spectator,
# realtime matches) runs against the RTDB emulator, not prod — prod now
# enforces an App Check token (see js/core/app-check.ts) that a headless CI
# browser can't produce, so a prod write here would just fail every time
# with 401 "Missing appcheck token". Doesn't need any repo secrets: the
# emulator-based specs run fully offline against a "demo-" project (no GCP
# credentials needed). A few non-duel specs still load pages that touch
# prod incidentally (e.g. the duel lobby's resume-session check) — those
# reads failing is harmless and not asserted on.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_ENV"

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit: browser binaries are already on disk, but the runner
      # image itself is ephemeral — apt-level system deps (libnss3 etc.)
      # still need reinstalling every run, just without the ~100-200MB
      # browser download that install --with-deps would otherwise redo.
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Setup Java 21
        # firebase-tools 15 raised the RTDB emulator's minimum Java runtime
        # to 21 ("firebase-tools no longer supports Java version before 21");
        # ubuntu-latest's default `java` on PATH is older than that, so
        # `emulators:start` in the webServer step below refused to start at
        # all (instant "Could not spawn `java -version`" / minimum-version
        # exit, before Playwright's readiness check ever got a chance to
        # time out). Reproduced and confirmed locally via a Node 24 Debian
        # container matching this job's Node version.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pre-download Firebase RTDB emulator
        # Downloads the emulator's Java binary up front. Without this, the
        # first download happens inside config.webServer at test-run time,
        # racing the two Vite servers for CPU/network and blowing their 30s
        # startup timeout (this is what was failing every run).
        run: npx firebase-tools setup:emulators:database

      - name: Run e2e tests
        # --workers=1: several specs here each drive 2-4 real browser
        # contexts through full duel matches at once (tournament, spectator,
        # async-challenge, ...) — running multiple such specs concurrently
        # (Playwright's default parallelism) causes CPU-contention-induced
        # timeouts that don't reproduce when each spec runs alone. Serial is
        # slower but reliable; these are heavy integration tests, not fast
        # unit tests, so that trade is the right one here.
        # --retries=1: this suite has documented, real CPU-contention
        # flakiness (see above) — a genuinely broken test still fails on
        # every retry, so this can't hide a real regression, only stops a
        # single flaky run from filing the tracking issue below.
        run: npx playwright test --project=chromium --reporter=list,html --workers=1 --retries=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # No alerting existed before this (2026-08-15) — e2e.yml deliberately
      # doesn't gate deploy.yml (see file header), so a failure here was
      # visible only to someone who thought to run `gh run list`. A real UI
      # bug (reset-confirm-dialog.tsx) shipped unnoticed for 2+ deploys
      # specifically because of this gap (docs/architecture-assessment.md
      # p.4/p.8). Fixed with the lowest-effort mechanism that needs zero new
      # infrastructure: file/update a GitHub Issue using the automatically-
      # provided GITHUB_TOKEN (no new secret, no external service) — issue
      # creation triggers GitHub's own default notifications (email/web) to
      # anyone watching the repo, same as any other issue. Matched by exact
      # title, not a label, so it doesn't depend on the label existing yet.
      - name: File or update a tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'E2E Tests failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `E2E Tests failed on \`${context.sha.slice(0, 7)}\` — [view run](${runUrl}).`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      # Self-healing: closes the tracking issue the moment E2E passes again,
      # so a fixed flake doesn't leave a stale "still failing" issue open.
      - name: Close tracking issue if E2E is passing again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'E2E Tests failing on main';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Passing again on \`${context.sha.slice(0, 7)}\` — closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
