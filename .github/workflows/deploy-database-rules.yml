name: Deploy Database Rules

# Redeploys database.rules.json to Firebase Realtime Database on every push
# to main that touches it (or via manual "Run workflow" in the Actions tab).
# Needs one repo secret — GitHub repo → Settings → Secrets and variables →
# Actions → New repository secret:
#
#   FIREBASE_SERVICE_ACCOUNT — a Google Cloud service-account key (JSON),
#   created at console.firebase.google.com → Project Settings → Service
#   accounts → Generate new private key, for the "english-words-trainer-557e8"
#   project (see .firebaserc). Paste the whole JSON file content as the
#   secret value.
#
# Without this secret the workflow fails (visible in the Actions tab) but
# nothing else breaks — the rules just have to be applied by hand instead,
# via the Firebase Console's Realtime Database → Rules tab.
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  group: deploy-database-rules
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json', 'utf8'))"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rules regression tests
        # JSON.parse above only catches syntax errors — this catches the
        # actual regression class this workflow used to allow through
        # unguarded: a collection-root ".write": true that lets anyone wipe
        # or bulk-overwrite an entire collection (see tests/build/
        # database-rules.test.ts and docs/legacy-modernization-roadmap.md §5a).
        run: npx vitest run tests/build/database-rules.test.ts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Deploy Realtime Database rules
        run: npx firebase-tools@13 deploy --only database --non-interactive
