<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages serves static files with no custom-header support, so this
      <meta> tag is the only place a CSP can live here — `frame-ancestors`/
      `sandbox`/`report-uri` are silently ignored when delivered this way
      (spec requirement), hence their absence below; this is defense-in-depth
      against a future dangerouslySetInnerHTML/escaping regression, not a
      clickjacking control.
      style-src needs 'unsafe-inline': React's style={{...}} props render as
      inline style="" attributes throughout the app, and style-src-attr falls
      back to style-src with no nonce/hash mechanism practical for
      per-element inline styles — tightening this would require moving every
      inline style to a class, out of scope here.
      connect-src's https://*.workers.dev covers the AI-tutor proxy
      (js/config.ts's AI_PROXY_URL, set at build time from the
      VITE_AI_PROXY_URL repo variable) — narrow this to the exact deployed
      Worker domain if/when it's pinned to a custom domain instead.
      The google.com/gstatic.com/googleapis.com entries are for Firebase App
      Check's reCAPTCHA v3 provider (js/core/app-check.ts) — inert (no
      network calls at all) until VITE_FIREBASE_APPCHECK_SITE_KEY is set,
      included now so turning that on later doesn't also require a CSP edit.
      googletagmanager.com/google-analytics.com/analytics.google.com are for
      Firebase Analytics (js/core/analytics.ts) — same inert-until-configured
      story, gated on VITE_FIREBASE_CONFIG's measurementId; see
      public/privacy.html's "Usage analytics" section.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://pixabay.com https://*.pixabay.com https://*.wikimedia.org https://*.wikipedia.org https://i.ytimg.com; media-src 'self' blob:; connect-src 'self' https://english-words-trainer-557e8-default-rtdb.europe-west1.firebasedatabase.app https://pixabay.com https://en.wikipedia.org https://*.workers.dev https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-src https://www.youtube.com https://www.google.com/recaptcha/; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      preconnect alone only shortens the connection, not the block: a plain
      <link rel="stylesheet"> to a cross-origin URL still holds up first
      paint until it loads (display=swap in the URL only controls how each
      @font-face behaves once that CSS is already applied — it does nothing
      about the link itself being render-blocking). Loaded as a non-blocking
      preload instead, swapped to an active stylesheet once it arrives —
      the standard pattern (web.dev "defer non-critical CSS"), same result
      (Google Fonts CSS applied) without holding up the first paint on it.
    -->
    <link
      id="font-preload"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Cinzel+Decorative:wght@400;700;900&display=swap"
    />
    <noscript>

      />
    </noscript>
